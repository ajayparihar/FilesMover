[DEFAULT]
; Default configuration settings for FilesMover

; Source directory to monitor for new files
source_dir = C:/Users/username/Downloads

; Destination directory to move files to
dest_dir = C:/Users/username/Organized

; Whether to include subdirectories when monitoring
include_subdirs = yes

; Processing delay in seconds (to avoid processing files that are still being written)
processing_delay = 2.0

; File conflict handling (skip, replace, rename)
conflict_handling = rename

; Whether to preserve file timestamps when moving
preserve_timestamps = yes

; File types to process (comma-separated, empty for all)
file_types = 

; Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_level = INFO

[ACTIVITY_TRACKER]
; Settings for the file activity tracker

; Whether to enable activity tracking
enable_tracking = no

; Inactive period in days before moving files to inactive directory
inactive_days = 30

; Directory to move inactive files to
inactive_dir = C:/Users/username/Inactive 