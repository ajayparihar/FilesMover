[Settings]
SourceDir=C:\Users\%USERNAME%\Desktop\Source
DestinationDir=C:\Users\%USERNAME%\Desktop\Dest
PollInterval=5
ConflictMode=rename
ProcessExisting=true

[Extensions]
Documents=.doc,.docx,.pdf,.txt,.rtf
Images=.jpg,.jpeg,.png,.gif,.bmp,.tiff
Videos=.mp4,.avi,.mov,.wmv,.mkv
Music=.mp3,.wav,.flac,.aac,.ogg
Archives=.zip,.rar,.7z,.tar,.gz
Executables=.exe,.msi,.bat
Scripts=.js,.html,.css,.php
DataFiles=.csv,.xml,.json 